<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Webb Editor</title>

        <link rel="icon" type="image/x-icon" href="img/favicon.ico" />

        <!-- CodeMirror 5 - stilar -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css" />

        <!-- CodeMirror 5 Hinting-stil -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/show-hint.min.css" />

        <!-- Linting -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/lint/lint.min.css">

        <!-- Font Awesome för ikoner -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

        <!-- Nerladdad temma -  Theme-->
        <link rel="stylesheet" href="codemirror/theme/mdn-like.css" />
        <link rel="stylesheet" href="codemirror/theme/paraiso-dark.css" />

        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="editor-container">
            
            <!-- Verktygsfält -->
            <div class="toolbar">
                <!-- Vänster verktygsfält - varumärkes bild och titel, flera knappar  -->
                <div class="toolbar-left">
                    <a href="https://lutosesa.github.io/programming/">
                        <img src="img/favicon.ico" alt="favicon-bild" width="25" height="25" class="img-brand" />
                    </a>
                    <span class="span-title-a">Webb</span>
                    <span class="span-title-b">Editor</span> 
                    <span class="span-title-c">(HTML, CSS, JavaScript)</span>

                    <button onclick="runCode()" class="btn btn-run" title="Kör koden">
                        <i class="fas fa-play"></i>
                        <span class="span-text">Kör koden</span>
                    </button>

                    <button onclick="clearCode()" class="btn btn-clear">
                        <i class="fas fa-trash-alt"></i>
                        <span class="span-text">Rensa kod</span>
                    </button>

                    <button onclick="formatCode()" class="btn btn-format">
                        <i class="fas fa-align-left"></i>
                        <span class="span-text">Formatera kod</span>
                    </button>

                    <button onclick="toggleFoldAll()" class="btn btn-fold">
                        <i class="fas fa-compress"></i>
                        <span class="span-text">Fäll ihop kod</span>
                    </button>

                    <button id="decreaseFont" class="btn btn-textsize" title="Minska textstorlek">
                        <i class="fas fa-minus"></i>
                    </button>

                    <button id="increaseFont" class="btn btn-textsize" title="Öka textstorlek">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <!-- Vänster verktygsfält - temaväljaren placeras här -->
                <div class="toolbar-right">
                    <button id="toggleTheme" class="btn-toggle" title="Byt tema">
                        <span class="btn-toggle-sun active">
                            <i class="fa-solid fa-sun icon-sun" style="color: rgb(220, 240, 42)"></i>
                        </span>
                        <span class="btn-toggle-moon inactive">
                            <i class="fa-regular fa-moon icon-moon" style="color: white"></i>
                        </span>
                    </button>
                </div>
            </div>

            <!-- Layout med Editor, en resider(ändra storleken) och Preview(förhandvisning) -->
            <div class="container">
                <div id="editor" class="editor"></div>
                <div id="resizer" class="resizer"></div>
                <iframe id="preview" class="preview"></iframe>
            </div>
        </div>

        <!-- CodeMirror 5 -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>

        <!-- Viktigt! XML krävs för att HTML och autokomplettering ska fungera -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>

        <!-- Stöd för HTML, CSS, JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>

        <!-- CodeMirror Hinting-system -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/show-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/xml-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/html-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/css-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/javascript-hint.min.js"></script>

        <!-- Stöd för stängning av taggar och måsvingar, hakparenteser och vanliga parenteser -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closetag.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.js"></script>

        <!-- Code Folding -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/foldcode.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/foldgutter.min.js"></script>

        <!-- Stöd för att fälla ihop olika språk -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/xml-fold.min.js"></script>
        <!-- För HTML -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/brace-fold.min.js"></script>
        <!-- För JavaScript och CSS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/comment-fold.min.js"></script>
        <!-- För kommentarer -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/indent-fold.min.js"></script>
        <!-- Indenterad kod -->

        <!-- Stöd för för kodformatering -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/format/formatting.min.js"></script>

        <!-- Linting -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/lint/lint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/lint/css-lint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/lint/javascript-lint.min.js"></script>

        <!-- ESLint och CSSLint -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/eslint/8.54.0/eslint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stylelint/15.10.1/stylelint.min.js"></script>

        <!-- Nerladdat Emmet-plugin för CodeMirror -->
        <!-- <script src="https://cdn.jsdelivr.net/npm/@emmetio/codemirror-plugin/dist/emmet-codemirror-plugin.min.js"></script> -->
        <script src="codemirror/emmet/emmet-codemirror-plugin.min.js"></script>

        <script src="js/script.js"></script>
    </body>
</html>
