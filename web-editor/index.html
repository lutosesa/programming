<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test Webb Editor</title>
        <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css" />
        <!-- CodeMirror CSS för autokomplettering -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/show-hint.min.css"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/codemirror-colorpicker/dist/codemirror-colorpicker.min.css"
        />
        <link rel="stylesheet" href="codemirror/theme/paraiso-dark.css" />
        <link rel="stylesheet" href="codemirror/theme/mdn-like.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="content">
            <div class="toolbar">
                <div class="toolbar-left">
                    <a href="https://lutosesa.github.io/programming/" target="_blank">
                        <img class="img-brand" src="img/logo.png" alt="logo-bild" />
                    </a>
                    <span class="brand-text">
                        <span class="brand-text-a">Webb</span>
                        <span class="brand-text-b">Editor</span>
                    </span>

                    <button class="btn-editor btn-html active" data-target="html" title="HTML kod">
                        <img src="img/tool-html.png" alt="html-bild" />
                    </button>

                    <button class="btn-editor btn-css" data-target="css" title="CSS kod">
                        <img src="img/tool-css.png" alt="css-bild" />
                    </button>

                    <button class="btn-editor btn-js" data-target="js" title="JS kod">
                        <img src="img/tool-js.png" alt="javascript-bild" />
                    </button>

                    <button id="clear-button" class="btn-tool btn-limit" title="Rensa koden">
                        <img src="img/clear.png" alt="clear-bild" />
                    </button>

                    <button id="format-button" class="btn-tool" title="Formatera koden">
                        <img src="img/format.png" alt="formatera-bild" />
                    </button>

                    <button id="collapse-button" class="btn-tool" title="fälla ihop koden">
                        <img src="img/collapse.png" alt="kollapsa-bild" />
                    </button>

                    <button id="decreaseFont" class="btn-tool btn-limit" title="Minska textstorlek">
                        <img src="img/minus.png" alt="minus-bild" />
                    </button>
                    <button id="increaseFont" class="btn-tool" title="Öka textstorlek">
                        <img src="img/plus.png" alt="plus-bild" />
                    </button>
                </div>

                <div class="toolbar-right">
                    <button id="toggleTheme" class="btn-toggle" title="Byt tema">
                        <span class="btn-toggle-sun active">
                            <img src="img/sol.png" alt="sol-bild" class="icon-sun" />
                        </span>
                        <span class="btn-toggle-moon inactive">
                            <img src="img/moon.png" alt="moon-bild" class="icon-moon" />
                        </span>
                    </button>
                </div>
            </div>

            <!-- Container för editor och preview -->
            <div id="editor-container" class="container">                
                <!-- Vänster sektion (Editor) -->
                <div id="editor-section" class="editor-section">
                    <div class="editor-container" id="html-container">
                        <h3><img src="img/web-html.png" alt="html-bild" width="21" height="21" />&nbsp;HTML</h3>
                        <textarea id="html-editor"><h1>Hej, världen!</h1></textarea>
                    </div>
                    <div class="editor-container hidden" id="css-container">
                        <h3><img src="img/web-css.png" alt="css-bild" width="21" height="21" />&nbsp;CSS</h3>
                        <textarea id="css-editor">h1 { color: red; }</textarea>
                    </div>
                    <div class="editor-container hidden" id="js-container">
                        <h3><img src="img/web-js.png" alt="js-bild" width="21" height="21" />&nbsp;JavaScript</h3>
                        <textarea id="js-editor">console.log("Hello World!");</textarea>
                    </div>
                </div>

                <div id="resizer" class="resizer"></div>

                <!-- Höger sektion (Förhandsvisning) -->
                <div id="preview-section" class="preview-section">
                    <h3><img src="img/preview1.png" alt="js-bild" width="21" height="21" />&nbsp;Förhandsvisning</h3>
                    <iframe id="preview" class="preview"></iframe>
                </div>
            </div>
        </div>

        <!-- CodeMirror version 5 -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>

        <!-- Viktigt! XML krävs för att HTML och autokomplettering ska fungera -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>

        <!-- Stöd för HTML, CSS, JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>

        <!-- Stöd för för kodformatering -->
        <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
        <script src="https://unpkg.com/prettier@2.8.8/parser-html.js"></script>
        <script src="https://unpkg.com/prettier@2.8.8/parser-postcss.js"></script>
        <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>
        <script>
            const prettierPlugins = {
                html: window.prettierPlugins.html,
                css: window.prettierPlugins.postcss, // Fixar CSS-parsern
                babel: window.prettierPlugins.babel,
            };
        </script>

        <!-- CodeMirror Addons för auto-close och matchning -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closetag.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/matchbrackets.min.js"></script>

        <!-- CodeMirror Addons för autokomplettering -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/show-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/xml-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/html-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/css-hint.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/javascript-hint.min.js"></script>

        <!-- Code Folding -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/foldcode.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/foldgutter.min.js"></script>
        <!-- Code Folding - Stöd för att fälla ihop olika språk -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/xml-fold.min.js"></script>
        <!-- HTML -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/brace-fold.min.js"></script>
        <!-- JS & CSS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/fold/comment-fold.min.js"></script>
        <!-- Kommentarer -->

        <!-- jQuery krävs för Colorpicker -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <!-- Colorpicker-tillägg -->
        <script src="https://cdn.jsdelivr.net/npm/codemirror-colorpicker/dist/codemirror-colorpicker.min.js"></script>

        <!-- CodeMirror Addons för att hantera kommentarer -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/comment/comment.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/comment/continuecomment.min.js"></script>

        <!-- Emmet-plugin för CodeMirror -->
        <script src="codemirror/emmet/emmet-codemirror-plugin.min.js"></script>

        <!-- CodeMirror - stöd för styleActiveLine -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/selection/active-line.min.js"></script>

        <script src="script.js"></script>
    </body>
</html>
